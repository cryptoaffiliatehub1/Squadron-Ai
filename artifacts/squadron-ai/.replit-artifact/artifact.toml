kind = "web"
previewPath = "/"
title = "Squadron AI"
description = "Production-ready Solana meme coin trading engine dashboard. Provides a full command center with live radar scanning, bot controls, paper/live trading mode, portfolio tracking, moonbag vault, circuit breaker status, AI token analysis, and automated daily/weekly reports."
version = "1.0.0"
id = "artifacts/squadron-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24775

[services.development]
run = "pnpm --filter @workspace/squadron-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/squadron-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/squadron-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24775"
BASE_PATH = "/"
